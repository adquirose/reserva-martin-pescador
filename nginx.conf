# ===============================================
# NGINX CONFIGURATION FOR REACT SPA
# Para usar en servidor Nginx
# ===============================================

server {
    listen 80;
    server_name www.reservamartinpescador.cl reservamartinpescador.cl;

    # Ruta de los archivos estáticos
    root /var/www/html;
    index index.html;

    # CORS Headers para archivos del tour (si es necesario)
    location ~* \.(jpg|jpeg|png|xml|js|swf|css)$ {
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept" always;
        add_header Access-Control-Max-Age 86400 always;
        
        # Cache para archivos estáticos
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Manejar archivos estáticos directamente
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Directorio krpano (si existe)
    location /krpano/ {
        try_files $uri =404;
        expires 1d;
    }

    # API routes (si existen)
    location /api/ {
        try_files $uri =404;
    }

    # REACT ROUTER: Todas las demás rutas van a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Handle OPTIONS requests
    if ($request_method = 'OPTIONS') {
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept" always;
        add_header Access-Control-Max-Age 86400 always;
        return 204;
    }

    # Gzip compression
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_comp_level 9;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}

# HTTPS redirect (opcional)
server {
    listen 80;
    server_name reservamartinpescador.cl www.reservamartinpescador.cl;
    return 301 https://$server_name$request_uri;
}